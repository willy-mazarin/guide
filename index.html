<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide d'achat — ordinateur reconditionné</title>
<meta name="description" content="Choisir un ordinateur reconditionné sans se tromper — Windows & Mac, portable & fixe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff; --bg:#eef0f3; --ink:#15181d; --muted:#5c6470; --faint:#8a929e;
    --hair:#e6e8ec; --hair-strong:#d6dae1;
    --win-1:#1657e0; --win-2:#0a2a72; --win-wash:#eef3fe;
    --mac-1:#31353d; --mac-2:#14171c; --mac-accent:#b98b45; --mac-wash:#f2f2f0;
    --no:#c23b3b; --avoid:#ca1a1a; --green:#1f9d5f;
    --shadow:0 18px 50px -24px rgba(20,30,50,.4),0 2px 6px rgba(20,30,50,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  a{color:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px;}

  /* ---------- TOP BAR ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);}
  .topbar__in{max-width:960px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;}
  .brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;cursor:pointer;font-family:inherit;flex:none;}
  .brand svg{width:24px;height:24px;color:var(--win-2);}
  .brand__t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;}

  /* ---------- MENU ---------- */
  .menu{display:flex;align-items:center;gap:2px;}
  .mi,.mi__btn{display:inline-flex;align-items:center;gap:5px;border:0;background:none;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:.12s;}
  .mi:hover,.mi__btn:hover{background:#f1f3f6;color:var(--ink);}
  .mi.on,.mi--drop.on .mi__btn{color:var(--win-2);}
  .mi--drop{position:relative;}
  .caret{width:11px;height:11px;opacity:.7;transition:.15s;}
  .mi--drop.open .caret{transform:rotate(180deg);}
  .mi__sub{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--hair);border-radius:11px;box-shadow:var(--shadow);padding:6px;min-width:150px;display:none;flex-direction:column;z-index:60;}
  .mi--drop.open .mi__sub{display:flex;}
  .mi__sub a{padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;}
  .mi__sub a:hover{background:#f1f3f6;color:var(--ink);}
  .mi__sub a.on{color:var(--win-2);background:var(--win-wash);}
  .topbar__right{margin-left:auto;display:flex;align-items:center;gap:9px;}
  .pdf-btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--win-1);color:#fff;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px;white-space:nowrap;transition:.12s;}
  .pdf-btn:hover{background:var(--win-2);}
  .pdf-btn svg{width:15px;height:15px;}
  .lang{display:inline-flex;border:1px solid var(--hair-strong);border-radius:9px;overflow:hidden;}
  .lang button{border:0;background:#fff;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;}
  .lang button.on{background:var(--ink);color:#fff;}
  .burger{display:none;flex-direction:column;justify-content:center;gap:4px;width:38px;height:34px;border:1px solid var(--hair-strong);border-radius:9px;background:#fff;cursor:pointer;padding:0 9px;}
  .burger span{height:2px;background:var(--ink);border-radius:2px;}

  /* ---------- SIGNATURE (sous le menu) ---------- */
  .subbar{border-top:1px solid var(--hair);background:rgba(255,255,255,.55);}
  .subbar__in{max-width:960px;margin:0 auto;padding:6px 20px;font-size:11.5px;color:var(--faint);}

  .backlink{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair-strong);background:#fff;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;margin-bottom:18px;transition:.12s;}
  .backlink:hover{border-color:var(--faint);color:var(--ink);}

  /* ---------- MON EXEMPLE ---------- */
  .cfg{display:grid;grid-template-columns:1fr 1.1fr;gap:22px;margin-top:22px;}
  @media (max-width:680px){.cfg{grid-template-columns:1fr;}}
  .cfg__specs{background:#fff;border:1px solid var(--hair);border-left:4px solid var(--win-1);border-radius:14px;padding:20px 22px;}
  .cfg__specs h3{font-family:'Space Grotesk',sans-serif;margin:0 0 12px;font-size:16px;}
  .spec{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px;}
  .spec:last-child{border-bottom:0;}
  .spec__k{color:var(--muted);}
  .spec__v{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);text-align:right;}
  .cfg__block{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:18px 20px;margin-bottom:14px;}
  .cfg__block:last-child{margin-bottom:0;}
  .cfg__block h4{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:14px;}
  .cfg__block p{margin:0;font-size:13.5px;color:var(--muted);}
  .cfg__block--warn{border-left:4px solid #e5871a;}

  /* ---------- MENU MOBILE ---------- */
  @media (max-width:820px){
    .burger{display:flex;}
    .menu{position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--hair);box-shadow:var(--shadow);flex-direction:column;align-items:stretch;gap:0;padding:8px;display:none;}
    .menu.open{display:flex;}
    .mi,.mi__btn{width:100%;justify-content:flex-start;font-size:15px;padding:12px;}
    .mi--drop{width:100%;}
    .mi--drop .caret{display:none;}
    .mi__sub{position:static;display:flex;box-shadow:none;border:0;padding:0 0 6px 16px;min-width:0;}
    .pdf-btn span{display:none;}
    .pdf-btn{padding:8px 10px;}
  }

  /* ---------- GENERIC ---------- */
  main{padding:26px 0 70px;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){main{animation:none;}}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);}

  /* ---------- HOME ---------- */
  .hero{text-align:center;padding:18px 0 30px;}
  .hero h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(28px,5vw,42px);letter-spacing:-.02em;margin:8px 0 10px;line-height:1.05;}
  .hero p{color:var(--muted);font-size:16px;max-width:520px;margin:0 auto;}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
  @media (max-width:680px){.groups{grid-template-columns:1fr;}}
  .grp{border-radius:16px;padding:22px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .grp--win{background:linear-gradient(135deg,var(--win-1),var(--win-2));}
  .grp--mac{background:linear-gradient(135deg,var(--mac-1),var(--mac-2));}
  .grp__os{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin-bottom:3px;}
  .grp--mac .grp__os span{color:var(--mac-accent);}
  .grp__d{font-size:13px;opacity:.85;margin-bottom:18px;}
  .grp__btns{display:flex;gap:10px;}
  .grp__btns button{flex:1;border:0;border-radius:11px;padding:14px 10px;background:rgba(255,255,255,.14);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .grp__btns button:hover{background:rgba(255,255,255,.24);transform:translateY(-2px);}
  .grp__btns svg{width:24px;height:24px;}
  .obs-cta{margin-top:18px;border:1px dashed var(--hair-strong);background:#fff;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;width:100%;text-align:left;font-family:inherit;transition:.15s;}
  .obs-cta:hover{border-color:var(--faint);box-shadow:var(--shadow);}
  .obs-cta svg{width:30px;height:30px;color:var(--win-1);flex:none;}
  .obs-cta b{font-family:'Space Grotesk',sans-serif;font-size:16px;}
  .obs-cta p{margin:2px 0 0;font-size:13px;color:var(--muted);}
  .obs-cta .arrow{margin-left:auto;color:var(--faint);font-size:20px;}

  /* ---------- PRODUCT HEADER ---------- */
  .phead{border-radius:16px;padding:26px 24px;color:#fff;margin-bottom:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .phead--win{background:linear-gradient(135deg,var(--win-1),var(--win-2));}
  .phead--mac{background:linear-gradient(135deg,var(--mac-1),var(--mac-2));}
  .phead .eyebrow{color:rgba(255,255,255,.8);}
  .phead h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:34px;letter-spacing:-.02em;margin:8px 0 4px;}
  .phead p{margin:0;opacity:.9;font-size:14px;}
  .phead--mac .accent{color:var(--mac-accent);}

  .sec-title{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;}
  .sec-title .dot{width:7px;height:7px;border-radius:50%;background:var(--win-1);}
  .mac .sec-title .dot{background:var(--mac-accent);}

  /* ---------- TIERS ---------- */
  .tiers{display:flex;flex-direction:column;gap:11px;}
  .tier{border:1.5px solid var(--hair);border-radius:13px;padding:15px 17px;background:#fff;display:grid;grid-template-columns:180px 1fr;gap:16px;}
  @media (max-width:620px){.tier{grid-template-columns:1fr;gap:10px;}}
  .tier--star{border:2px solid var(--green);background:var(--win-wash);}
  .mac .tier--star{background:var(--mac-wash);}
  .tier__lvl{display:flex;gap:3px;margin-bottom:7px;}
  .tier__lvl i{width:17px;height:5px;border-radius:2px;background:var(--hair-strong);}
  .tier__lvl i.on{background:var(--win-1);}
  .mac .tier__lvl i.on{background:var(--mac-accent);}
  .tier__name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--green);color:#fff;padding:3px 8px;border-radius:20px;}
  .tier__hz{font-size:11.5px;color:var(--faint);margin-top:3px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;padding:5px 10px;border-radius:8px;background:#f4f5f7;border:1px solid var(--hair);white-space:nowrap;}
  .tier--star .chip{background:#fff;}
  .tier__note{font-size:12.5px;color:var(--muted);}

  /* ---------- GPU ---------- */
  .callout{display:flex;gap:13px;align-items:flex-start;border:1px dashed var(--hair-strong);background:#fafbfc;border-radius:13px;padding:15px 17px;margin-top:20px;}
  .callout svg{width:26px;height:26px;flex:none;color:var(--win-1);}
  .mac .callout svg{color:var(--mac-1);}
  .callout h3{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0 0 4px;}
  .callout p{margin:0;font-size:13px;color:var(--muted);}

  /* ---------- SPLIT ---------- */
  .split{display:grid;grid-template-columns:1fr 1.15fr;gap:26px;margin-top:24px;}
  @media (max-width:620px){.split{grid-template-columns:1fr;gap:20px;}}
  .col-h{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin:0 0 11px;}
  .col-h--avoid{color:var(--avoid);}
  .col-h--models{color:var(--green);}
  .avoid{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .avoid li{display:flex;gap:9px;font-size:13.5px;align-items:flex-start;}
  .avoid .x{flex:none;width:17px;height:17px;border-radius:50%;background:#fbeaea;color:var(--no);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
  .avoid small{display:block;color:var(--faint);font-size:12px;}
  .models{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .models li{font-size:13.5px;display:flex;gap:9px;align-items:flex-start;}
  .models .d{flex:none;width:13px;height:2px;border-radius:2px;background:var(--win-1);margin-top:9px;}
  .mac .models .d{background:var(--mac-accent);}
  .models b{font-weight:600;}
  .buy{margin-top:14px;display:inline-flex;align-items:center;gap:9px;text-decoration:none;font-size:13px;font-weight:600;padding:11px 16px;border-radius:11px;background:var(--win-1);color:#fff;transition:.15s;}
  .mac .buy{background:var(--mac-1);}
  .buy:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .buy svg{width:15px;height:15px;}
  .buy .sub{opacity:.72;font-weight:500;}

  .infobar{margin-top:24px;border-radius:13px;padding:15px 17px;font-size:13px;background:var(--win-wash);color:var(--win-2);display:flex;gap:11px;align-items:flex-start;}
  .mac .infobar{background:var(--mac-wash);color:var(--mac-2);}
  .infobar svg{width:20px;height:20px;flex:none;}

  /* ---------- OBSOLESCENCE ---------- */
  .obs-intro{max-width:640px;font-size:16px;color:var(--muted);margin-bottom:6px;}
  .obs-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px;}
  @media (max-width:680px){.obs-grid{grid-template-columns:1fr;}}
  .obs-card{border-radius:16px;padding:24px;box-shadow:var(--shadow);}
  .obs-card--win{background:#fff;border-top:4px solid var(--win-1);}
  .obs-card--mac{background:#fff;border-top:4px solid var(--mac-accent);}
  .obs-card h2{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0 0 3px;}
  .obs-tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
  .obs-card--win .obs-tag{color:var(--win-1);}
  .obs-card--mac .obs-tag{color:var(--mac-accent);}
  .obs-card p{font-size:14px;color:var(--muted);margin:0 0 12px;}
  .obs-card p b{color:var(--ink);font-weight:600;}
  .takeaway{margin-top:22px;border-radius:14px;background:var(--ink);color:#fff;padding:22px 24px;}
  .takeaway h3{font-family:'Space Grotesk',sans-serif;margin:0 0 8px;font-size:17px;}
  .takeaway p{margin:0;font-size:14px;opacity:.9;}
  .takeaway b{color:#fff;}

  .footer{border-top:1px solid var(--hair);margin-top:40px;padding:22px 0;color:var(--faint);font-size:12px;text-align:center;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__in">
    <button class="brand" onclick="go('home')" aria-label="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke-linecap="round"/></svg>
      <span class="brand__t" data-ui="brand"></span>
    </button>
    <nav class="menu" id="menu">
      <a class="mi" data-key="home" onclick="go('home')"></a>
      <div class="mi--drop" data-key="win">
        <button class="mi__btn" onclick="toggleDrop(this)">Windows<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="mi__sub"><a data-key="win-laptop" onclick="go('win-laptop')"></a><a data-key="win-desktop" onclick="go('win-desktop')"></a></div>
      </div>
      <div class="mi--drop" data-key="mac">
        <button class="mi__btn" onclick="toggleDrop(this)">Mac<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="mi__sub"><a data-key="mac-laptop" onclick="go('mac-laptop')"></a><a data-key="mac-desktop" onclick="go('mac-desktop')"></a></div>
      </div>
      <a class="mi" data-key="obsolescence" onclick="go('obsolescence')"></a>
      <a class="mi" data-key="my-config" onclick="go('my-config')"></a>
    </nav>
    <div class="topbar__right">
      <a class="pdf-btn" href="fiches_achat.pdf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v11M8 11l4 3 4-3" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 20h14" stroke-linecap="round"/></svg><span data-ui="pdf"></span></a>
      <div class="lang"><button id="lang-fr" onclick="setLang('fr')">FR</button><button id="lang-en" onclick="setLang('en')">EN</button></div>
      <button class="burger" aria-label="menu" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="subbar"><div class="subbar__in"><span data-ui="tagline"></span></div></div>
</header>

<div class="wrap"><main id="app"></main></div>
<div class="footer wrap"><span data-ui="footer"></span></div>

<script>
/* ============ CONTENU BILINGUE ============ */
const UI = {

};

const PRODUCTS = {
  "win-laptop":{
    theme:"win", os:"Windows",
    kind:{fr:"PC portable",en:"Laptop"},
    sub:{fr:"Reconditionné professionnel",en:"Business-grade refurbished"},
    tiers:[
      {lvl:1,name:{fr:"Limite basse",en:"Bare minimum"},hz:{fr:"Court terme",en:"Short term"},
       chips:{fr:["Core i5 · 5ᵉ gén","RAM 16 Go","SSD","Écran Full HD"],en:["Core i5 · 5th gen","16 GB RAM","SSD","Full HD screen"]},
       note:{fr:"Fonctionne avec Windows 11, mais Microsoft ne le garantit pas officiellement.",en:"Runs Windows 11, but Microsoft doesn't officially guarantee it."}},
      {lvl:2,star:true,name:{fr:"Minimum recommandé",en:"Recommended minimum"},hz:{fr:"Moyen terme et +",en:"Medium term & up"},
       chips:{fr:["Core i5 · 8ᵉ gén","RAM 16-32 Go","SSD","Écran Full HD"],en:["Core i5 · 8th gen","16-32 GB RAM","SSD","Full HD screen"]},
       note:{fr:"Compatible Windows 11 officiel. Le bon équilibre prix / tranquillité.",en:"Officially Windows 11 compatible. The sweet spot of price vs. peace of mind."}},
      {lvl:3,name:{fr:"Confort",en:"Comfort"},hz:{fr:"Long terme",en:"Long term"},
       chips:{fr:["Core i5/i7 · 10ᵉ gén +","RAM 32 Go","SSD","Écran Full HD"],en:["Core i5/i7 · 10th gen +","32 GB RAM","SSD","Full HD screen"]},
       note:{fr:"Vous préférez AMD ? Un équivalent existe pour chaque gamme.",en:"Prefer AMD? There's an equivalent for every range."}},
    ],
    gpu:{fr:"Soudée : elle ne se remplace pas comme sur un fixe. Elle augmente le prix et réduit l'autonomie. À viser surtout pour le jeu, le montage vidéo ou la 3D (GTX 1650 ou mieux). Sinon, le GPU intégré suffit.",
         en:"Soldered: it can't be swapped like on a desktop. It raises the price and shortens battery life. Worth it mainly for gaming, video editing or 3D (GTX 1650 or better). Otherwise, integrated graphics are enough."},
    avoid:[

function renderProduct(key){
  const p = PRODUCTS[key];
  const mac = p.theme==="mac";
  const tiers = p.tiers.map(ti=>{
    const dots = [1,2,3].map(n=>`<i class="${n<=ti.lvl?'on':''}"></i>`).join("");
    const chips = L(ti.chips).map(c=>`<span class="chip">${c}</span>`).join("");
    const badge = ti.star?`<span class="badge">${L(UI.badge)}</span>`:"";
    return `<div class="tier ${ti.star?'tier--star':''}">
      <div><div class="tier__lvl">${dots}</div><div class="tier__name">${L(ti.name)} ${badge}</div><div class="tier__hz">${L(ti.hz)}</div></div>
      <div><div class="chips">${chips}</div><div class="tier__note">${L(ti.note)}</div></div>
    </div>`;
  }).join("");
  const avoid = p.avoid.map(a=>`<li><span class="x">✕</span><span>${L(a.m)}${a.s?`<small>${L(a.s)}</small>`:""}</span></li>`).join("");
  const models = p.models.map(m=>`<li><span class="d"></span><span><b>${m.n}</b> — ${L(m.d)}</span></li>`).join("");
  return `
  <button class="backlink" onclick="go('home')">← ${L(UI.back)}</button>
  <div class="${mac?'mac':''}">
    <div class="phead phead--${p.theme}">
      <p class="eyebrow">${p.os}</p>
      <h1>${L(p.kind)}</h1>
      <p>${L(p.sub)}</p>
    </div>
    <div class="sec-title"><span class="dot"></span>${L(UI.tiers)}</div>
    <div class="tiers">${tiers}</div>
    <div class="callout">${chipSvg.replace('rect x="6" y="6" width="12" height="12" rx="2"','rect x="5" y="7" width="14" height="10" rx="2"')}
      <div><h3>${L(UI.gpu)}</h3><p>${L(p.gpu)}</p></div>
    </div>
    <div class="split">
      <div><p class="col-h col-h--avoid">${L(UI.avoid)}</p><ul class="avoid">${avoid}</ul></div>
      <div><p class="col-h col-h--models">${L(UI.models)}</p><ul class="models">${models}</ul>
        <a class="buy" href="${p.buy}" target="_blank" rel="noopener">${cartSvg}${L(UI.buy)} <span class="sub">· ${L(UI.buy_s)}</span></a>

}

  const blocks=c.blocks.map(bl=>`<div class="cfg__block ${bl.warn?'cfg__block--warn':''}"><h4>${L(bl.title)}</h4><p>${L(bl.body)}</p></div>`).join("");
  return `
  <button class="backlink" onclick="go('home')">← ${L(UI.back)}</button>
  <p class="eyebrow">${L(c.eyebrow)}</p>
  <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,4.5vw,38px);letter-spacing:-.02em;margin:8px 0 14px">${L(c.title)}</h1>
  <p class="obs-intro">${L(c.intro)}</p>
  <div class="cfg">
    <div class="cfg__specs"><h3>${L(c.specsTitle)}</h3>${specs}</div>
    <div class="cfg__side">${blocks}</div>
  </div>`;
}

/* ============ ROUTAGE ============ */
function currentView(){
  const h = location.hash.replace('#','');
  if(PRODUCTS[h]) return h;
  if(h==='obsolescence') return 'obsolescence';
  if(h==='my-config') return 'my-config';
  return 'home';
}
function render(){
  const v = currentView();
  if(v==='home') app.innerHTML = renderHome();
  else if(v==='obsolescence') app.innerHTML = renderObs();
  else if(v==='my-config') app.innerHTML = renderConfig();
  else app.innerHTML = renderProduct(v);
  buildMenu(v);
  document.querySelectorAll('[data-ui]').forEach(el=>{el.textContent=L(UI[el.dataset.ui]);});
  document.documentElement.lang = lang;
  window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
}
function buildMenu(v){
  const labels={home:L(UI.home),'win-laptop':L(UI.laptop),'win-desktop':L(UI.desktop),'mac-laptop':L(UI.laptop),'mac-desktop':L(UI.desktop),obsolescence:L(UI.obs),'my-config':L(UI.myconfig)};
  document.querySelectorAll('[data-key]').forEach(el=>{
    const k=el.dataset.key;
    if(labels[k]!==undefined){ el.textContent=labels[k]; el.classList.toggle('on', k===v); }
  });
  const win=(v==='win-laptop'||v==='win-desktop'), mac=(v==='mac-laptop'||v==='mac-desktop');
  const wd=document.querySelector('.mi--drop[data-key="win"]'); if(wd) wd.classList.toggle('on',win);
  const md=document.querySelector('.mi--drop[data-key="mac"]'); if(md) md.classList.toggle('on',mac);
}
function toggleMenu(){ document.getElementById('menu').classList.toggle('open'); }
function toggleDrop(btn){
  const d=btn.closest('.mi--drop'), was=d.classList.contains('open');
  document.querySelectorAll('.mi--drop').forEach(x=>x.classList.remove('open'));
  if(!was) d.classList.add('open');
}
function closeMenus(){
  document.getElementById('menu').classList.remove('open');
  document.querySelectorAll('.mi--drop').forEach(d=>d.classList.remove('open'));
}
document.addEventListener('click',e=>{ if(!e.target.closest('.mi--drop')) document.querySelectorAll('.mi--drop').forEach(d=>d.classList.remove('open')); });
function go(v){ closeMenus(); location.hash = v==='home' ? '' : v; if(currentView()===v) render(); }
function setLang(l){
  lang = l;
  try{ localStorage.setItem('lang', l); }catch(e){}
  document.getElementById('lang-fr').classList.toggle('on', l==='fr');
  document.getElementById('lang-en').classList.toggle('on', l==='en');
  render();
}

window.addEventListener('hashchange', render);
setLang(lang);
</script>
